name: deadbolt

services:
  deadbolt:
    build: .
    ports:
      - "${IOT_PORT:-5002}:6000"
    environment:
      # Per-team flag injected by the platform. DEVICE_KEY is randomized in the
      # entrypoint; do not set it here.
      FLAG: "${FLAG:-CTF{deadbolt_l3ngth_3xtension_ala_carte}}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: "0.50"
    pids_limit: 64
    restart: unless-stopped
